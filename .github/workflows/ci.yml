name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Linux is the primary platform. The authoritative gate stays scripts/verify.py;
  # the portability step in this job names its two test files instead of copying any
  # gate step, so there is still exactly one place that defines the full gate.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      # Plan-mandated cross-platform check: the cross-process session lock
      # (compare-and-append winner) and process-group / process-supervision
      # behaviour. Kept as its own readable step so a failure here is attributable
      # without reading the whole gate log.
      - name: Multiprocess lock and process supervision
        run: python -m pytest tests/redesign/test_session_multiprocess_cas.py tests/redesign/test_process_supervisor.py -q
      # The gate is scripts/verify.py, not a second copy of its steps. Running the
      # same file the developer runs is what makes local and CI parity verifiable:
      # previously this workflow rebuilt a subset inline, so it could not catch the
      # clean-installation and distribution-validation steps at all, and its wheel
      # audit was a hand-copied duplicate of scripts/verifylib/wheelaudit.py that was
      # free to drift from the one the developer runs.
      #
      # verify.py prints one line per step (name, exit code, duration), so the step
      # breakdown is still visible in the job log.
      - name: Gate
        run: python scripts/verify.py

  # The same authoritative gate on Windows, because the harness hosts platform
  # specific locking and process supervision: Windows takes an exclusive file lock
  # with msvcrt and terminates descendants through a Job Object instead of a POSIX
  # process group. The cross-process lock and process-supervision tests run here as
  # the same dedicated step as on Linux.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Multiprocess lock and process supervision
        run: python -m pytest tests/redesign/test_session_multiprocess_cas.py tests/redesign/test_process_supervisor.py -q
      # Windows-only acceptance. When the harness process dies, its Job Object must
      # close and kill every descendant; there is no POSIX equivalent of this
      # contract, so the check is gated to a Windows runner (runs-on above) and the
      # condition states it again in the step itself.
      - name: Windows Job Object host-death acceptance
        if: runner.os == 'Windows'
        run: python -m pytest "tests/redesign/test_process_supervisor.py::test_windows_host_death_closes_job_and_kills_descendants" -q
      - name: Gate
        run: python scripts/verify.py
