name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,feishu]"
      # The gate is scripts/verify.py, not a second copy of its steps. Running the
      # same file the developer runs is what makes local and CI parity verifiable:
      # previously this workflow rebuilt a subset inline, so it could not catch the
      # clean-installation and distribution-validation steps at all, and its wheel
      # audit was a hand-copied duplicate of scripts/verifylib/wheelaudit.py that was
      # free to drift from the one the developer runs.
      #
      # verify.py prints one line per step (name, exit code, duration), so the step
      # breakdown is still visible in the job log.
      - name: Gate
        run: python scripts/verify.py
