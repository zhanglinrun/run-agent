[task]
id = "python-config-precedence"
version = "1"
kind = "cross-module"
budget_seconds = 120
artifacts = ["config.py"]
fail_to_pass = [
    "test_missing_override_falls_back_to_default_region",
    "test_missing_override_falls_back_to_default_retries",
    "test_missing_override_falls_back_to_default_timeout",
    "test_partial_override_keeps_the_other_defaults",
]

[grader]
command = ["{python}", "-m", "pytest", "-q", "grader"]
