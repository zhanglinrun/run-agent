[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "run-agent-harness"
version = "0.4.0"
description = "A provider-neutral Python agent core with a composable extension host"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "anthropic>=0.40.0",
  "python-dotenv>=1.0.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
  "pyarrow>=15.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]
swebench = [
  "pyarrow>=15.0",
  "swebench==5.0.2",
]

[project.scripts]
run-agent = "agents.cli:main"
run-agent-eval = "agents.evaluation.cli:main"
run-agent-benchmark = "agents.evaluation.benchmarks:main"
run-agent-compare = "agents.evaluation.compare:main"
run-agent-coding-benchmark = "agents.evaluation.coding:main"
run-agent-swebench = "agents.evaluation.swebench:main"

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
