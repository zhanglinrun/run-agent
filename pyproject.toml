[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "run-agent-harness"
version = "0.5.0"
description = "An extensible local agent harness with interactive coding, persistent sessions, a Feishu gateway, and evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.0",
    "httpx[socks]>=0.27",
    "packaging>=24.0",
    "pillow>=11.0",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
    "pygments>=2.18",
    "rich>=13.0",
    "prompt-toolkit>=3.0.52",
    "textual>=8.2.8",
    "typer>=0.12",
]

[project.optional-dependencies]
feishu = [
    "lark-oapi>=1.7.3,<2",
]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[project.scripts]
run = "run_agent_entry:main"

[tool.hatch.build.targets.wheel]
only-include = ["src/run_agent_entry.py", "src/run_agent_ai", "src/run_agent_core", "src/run_agent_coding", "src/run_agent_gateway", "src/run_agent_observability", "src/run_agent_evals", "src/run_agent_extensions"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]
# The Linux process-group contract is reached through getattr because the Windows type
# stubs do not declare killpg, pidfd_open, pidfd_send_signal or SIGKILL, and the
# temporary pipe is handed to ProcessExecution rather than scoped to a block. Both are
# properties of these two platform shims, so the policy lives here once instead of as
# seven comments in the code.
"src/run_agent_coding/host/processes.py" = ["B009", "SIM115"]
"src/run_agent_coding/host/process_probe.py" = ["B009"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["run_agent_ai", "run_agent_core", "run_agent_coding", "run_agent_gateway", "run_agent_observability", "run_agent_evals", "run_agent_extensions"]

[[tool.mypy.overrides]]
module = "pygments.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lark_oapi.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
