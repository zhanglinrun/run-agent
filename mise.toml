# Canonical project tasks.
#
# The /until-done CI hook discovers tasks by verb (run `mise tasks ls --json`)
# and executes `mise run <verb>`. Every task therefore delegates to the single
# gate script instead of re-implementing checks, so the hook, CI and local runs
# cannot drift apart.

[tasks.compile]
description = "Byte-compile the source, extensions and tests"
run = "python scripts/gate.py --only compile"

[tasks.format]
description = "Check formatting with ruff"
run = "python scripts/gate.py --only format"

[tasks.lint]
description = "Lint with ruff"
run = "python scripts/gate.py --only lint"

[tasks.typecheck]
description = "Type check with mypy"
run = "python scripts/gate.py --only typecheck"

[tasks.test]
description = "Run the test suite"
run = "python scripts/gate.py --only test"

[tasks.build]
description = "Build the distribution and audit the wheel layout"
run = "python scripts/gate.py --only build,wheel-audit"

# Not a CI verb: the full gate, for local use.
[tasks.verify]
description = "Run the complete verification gate"
run = "python scripts/gate.py"

[tasks.verify-fast]
description = "Run the changed-file subset of the gate"
run = "python scripts/gate.py --fast"
